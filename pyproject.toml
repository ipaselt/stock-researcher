[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-researcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.5.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["stock_researcher*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the network (run with -m live)"]
